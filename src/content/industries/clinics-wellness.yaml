build:
  heading: Pages your patients actually look for
  image: ../../assets/industries/clinics-wellness/build.jpg
  items:
    - title: Treatment pages
      text: Clearly stated, fully compliant with all your market's specific rules and standards
    - title: Practitioner profiles
      text: Credentials that patients can quickly verify within seconds for complete peace of mind
    - title: A first-visit guide
      text: A nervous patient can easily picture the entire process clearly now.
    - title: Photo tours of the space
      text: Guests always know exactly what to expect during their visit here.
    - title: International patient pages
      text: Travel and booking questions answered together for a seamless, hassle-free experience
    - title: Booking and enquiry paths
      text: Bookable anytime from your phone, wherever you are, with ease.

difference:
  heading: The practice looks like the obvious choice
  lead: What changes from the first week your new site goes live.
  without:
    - Treatment research ends without booked consultations
    - Medical tourists compare clinics elsewhere
    - Credentials stay hidden, so trust never lands
    - Treatment pages leave patients confused
    - Patients phone the desk instead of booking
    - Insurance and languages unclear, desk overloaded
    - The clinic reads like a running promotion
  with:
    - Treatment research turns into booked consultations
    - International patients compare you across countries
    - Credentials and registrations build trust before visits
    - Treatments and packages explained plainly
    - Patients book on WhatsApp, LINE or online
    - Insurance and languages shown, fewer desk calls
    - The clinic reads as calm and credible

process:
  heading: A site built to earn the patient's<br />trust before they call
  steps:
    - title: Research & Strategy
      text: We study your competitors, your services and how patients find you, so every page answers the questions your patients actually ask.
      points:
        - Competitor research
        - A sitemap built around your treatments
        - How patients find you, mapped
    - title: Visual Design
      text: We design every page for your practice, so the site looks as calm and credible as the care you provide.
      points:
        - Fully custom design
        - A reassuring look and feel
        - Premium finish on every page
    - title: Messaging & Copywriting
      text: Professional writers explain your treatments in plain language a nervous first-time patient can follow.
      points:
        - Persuasive, plain-English copy
        - Treatment pages written clearly
        - Practitioner profiles
    - title: UI/UX Design
      text: Every page gives the reader a clear next step, and works just as well on the phone they're reading on.
      points:
        - Enquiry paths on every page
        - Responsive on every device
        - Booking flows that work across time zones
    - title: Development & QA
      text: We build on the latest tech stack, so the site loads fast, reads correctly to search engines and AI tools, and is tested on every device and browser before launch.
      points:
        - Latest tech stack
        - Fast, SEO-ready build
        - Integrated with your tools

growth:
  heading: What a website built<br />for bookings does
  lead: Six improvements that help patients choose your practice with confidence, and book.
  items:
    - title: Conversion-focused UX
      text: Every page moves patients towards booking a consultation.
    - title: Fast load speeds
      text: Pages open fast on late-night mobile searches.
    - title: Search and AI visibility
      text: Patients and AI tools find you when researching treatments.
    - title: Analytics
      text: You see which treatments drive consultations.
    - title: A CMS the team runs
      text: Staff update treatments and hours without a developer.
    - title: Security and scale
      text: Patient-facing pages stay secure as traffic grows.

value:
  heading: Everything it takes to win more<br />patient bookings, in one team
  items:
    - title: Built for English-speaking buyers
      text: Your patients, expat and international, judge you in English. We write for them, so nothing reads translated.
    - title: AI-native, not AI-dependent
      text: We use AI to research treatments, reviews and rival clinics fast. Experts direct it and sign off every line, so nothing generic ships.
    - title: Web design that wins business
      text: Every page answers what patients worry about, then leads them to book a consultation.
    - title: The whole team, none of the overhead
      text: Your clinic gets the whole team, from strategist to QA, with nobody to recruit, onboard or manage.
    - title: You look sharper than your competitors
      text: Design and tone that feel as trustworthy as your doctors, so patients choose you over the clinic down the road.
  writerLine: Same-week appointments, in English.

