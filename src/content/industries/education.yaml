title: Education
description: Websites for schools, universities and academies across Asia. We build sites that win the family's decision, and turn it into applications and open day bookings.
order: 8

hero:
  eyebrow: Websites for education
  heading: Your school online,<br />before families ever visit
  text: Parents and students judge your institution on its website months before they enquire. We build sites that win that decision, and turn it into applications and open day bookings.
  image: ../../assets/industries/education/hero.jpg
  fade: "#31271d"

problem:
  heading: Your school is better than<br />your website is telling families
  lead: Families judge the school by the website, long before they walk through the gate.
  items:
    - title: Enquiries are down on last year
      text: The admissions cycle opened, and the numbers have not caught up with the year before.
    - title: Families email the same questions
      text: Fees, curriculum and entry requirements are on the site somewhere, but parents cannot find them.
    - title: A competitor looks sharper online
      text: Their site comes up first, and yours looks like it was built by a committee that stopped meeting.

