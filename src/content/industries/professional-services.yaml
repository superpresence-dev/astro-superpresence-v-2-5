build:
  heading: Pages built for how clients choose firms
  image: ../../assets/industries/professional-services/build.jpg
  items:
    - title: Service pages
      text: One page per service, so a client with a specific problem finds exactly how you solve it.
    - title: Sector pages
      text: Industry pages that let clients see themselves and their situation in your work.
    - title: Team pages
      text: The people clients will work with, presented with the weight they deserve.
    - title: Insight and articles
      text: Your expertise published, so clients meet your thinking before they meet you.
    - title: Case studies and results
      text: Your track record told in ways that protect confidentiality and still persuade.
    - title: Contact and enquiry flows
      text: Getting in touch made simple, so interest turns into a conversation.

difference:
  heading: What a sharper presence delivers
  lead: What changes when the site finally matches the firm.
  without:
    - Referrals check your site and hesitate
    - The right specialist never gets the enquiry
    - No insights, so the firm fades from mind
    - Offices blur together in one confusing site
    - Caution produces a site that persuades nobody
    - Careers pages fail to attract laterals
  with:
    - Referrals check your site and confirm you're right
    - Partners and sector expertise shown properly
    - Insights prove thinking and keep you top of mind
    - Practice areas and jurisdictions clear across offices
    - Rules respected while the firm still persuades
    - Careers section supports lateral recruitment

process:
  heading: The firm clients find online<br />finally matches the one they meet
  steps:
    - title: Research & Strategy
      text: We study your competitors, your services and how clients find you before anything is designed, so nothing on the site is built on assumptions.
      points:
        - Competitor research
        - Sitemap built around your services
        - Marketing funnel mapping
    - title: Visual Design
      text: Every screen is drawn for your firm, so the site carries the weight your reputation already has when a client opens it.
      points:
        - Fully custom design
        - Premium visual standard
        - Design for authority and trust
    - title: Messaging & Copywriting
      text: Professional writers write copy that makes your firm the obvious choice, in words your clients use.
      points:
        - Persuasive page copy
        - Service and sector messaging
        - Copy written in English
    - title: UI/UX Design
      text: Every page is built to move a visitor towards getting in touch, on any device.
      points:
        - Conversion-focused page flows
        - Enquiry-focused layouts
        - Responsive on every device
    - title: Development & QA
      text: We build on the latest tech stack, fast and structured for search engines, and test everything before launch.
      points:
        - Latest tech stack build
        - Fast load speeds
        - SEO-ready structure

growth:
  heading: What a website built to win enquiries does
  lead: Six improvements that turn your reputation into enquiries from the right clients.
  items:
    - title: Conversion-focused UX
      text: Every page moves visitors towards an enquiry.
    - title: Fast load speeds
      text: Pages open quickly to keep up with the pace of busy clients.
    - title: Search and AI visibility
      text: Referrers and AI tools find the right specialist.
    - title: Analytics
      text: You can clearly see which sectors drive the most enquiries.
    - title: A CMS the team runs
      text: Lawyers publish insights without needing a developer involved.
    - title: Security and scale
      text: The site stays dependable as the firm grows.

value:
  heading: Everything it takes to win<br />more clients, in one team
  items:
    - title: Built for English-speaking buyers
      text: Your clients judge advisers in English. We write for them, so your expertise never reads translated.
    - title: AI-native, not AI-dependent
      text: We use AI to research your market, peers and client questions fast. Experts direct it and sign off every line, so nothing generic ships.
    - title: Web design that wins business
      text: Every page shows clients what you do and who you do it for, then leads them to get in touch.
    - title: The whole team, none of the overhead
      text: Your firm gets the whole team, from strategist to QA, with nobody to recruit, onboard or manage.
    - title: You look sharper than your competitors
      text: Design and tone that match the quality of your advice, so you stand out from larger firms.
  writerLine: Cross-border deals between Thailand and Japan.

