title: Hotels & hospitality
description: Websites for independent hotels and resorts across Asia. We build sites that win the booking decision, so more of each booking stays with the property.
order: 7

hero:
  eyebrow: Websites for independent hotels
  heading: Keep more of each booking, starting with the website
  text: Guests find you on a listing, then open your site to decide where to book. We build sites that win that decision, so more of each booking stays with the property.
  image: ../../assets/industries/hotels-hospitality/hero.jpg

problem:
  heading: Commission rises every year,<br />and direct bookings stay flat
  lead: Every guest your site loses goes back to the listing, and pays the commission.
  items:
    - title: The site still shows the old rooms
      text: The renovation finished months ago, and guests are still looking at the ones you replaced.
    - title: Guests book back on the listing
      text: They open your site, it loads slowly on a phone, and they go back to where they found you.
    - title: The commission line keeps growing
      text: Every year more of the room rate leaves the property, and the direct share never moves.

who:
  heading: For properties whose guests<br />check the website first
  lead: Independent hotels, resorts, boutique properties, serviced residences and villas across Asia. Your guests all run the same check before they book, and the site has to pass it.
