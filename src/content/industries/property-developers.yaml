  note: Don't see your kind of development? Tell us about the project.

build:
  heading: The pages a development actually needs
  image: ../../assets/industries/property-developers/build.jpg
  items:
    - title: Development story
      text: The concept of this place explained clearly in just one minute.
    - title: Units and floorplans
      text: Layouts that buyers can easily compare and vividly picture in their minds
    - title: Location and surroundings
      text: An honest view of everything surrounding the property, shown clearly and fairly
    - title: Specification and finishes
      text: The specific details that buyers frequently request from their agents.
    - title: Construction progress
      text: The construction, impressive and easily seen from far beyond the borders.
    - title: Gallery
      text: High-quality renders and photography providing ample space to showcase and sell

difference:
  heading: What the site does for the launch
  lead: The same development, presented the way buyers expect.
  without:
    - Launch interest drifts away before anyone books
    - Each launch looks like a different developer
    - Buyers must call before they can shortlist
    - Overseas buyers lack ownership rules and terms
    - Agents send PDFs instead of something credible
    - Buyers hear nothing after the sale
    - Track record stays invisible to new buyers
  with:
    - Launch interest turns into gallery appointments
    - Launch microsites under one developer brand
    - Floor plans and availability shortlist buyers
    - Overseas buyers get rules, terms, roadshow dates
    - Agents and sales teams send the site confidently
    - Construction updates keep buyers informed after sale
    - Completed projects prove track record and handover

process:
  heading: We build the site around<br />how buyers decide
  steps:
    - title: Research & Strategy
      text: We study your competitors and your buyers before anything is designed, so every page earns its place.
      points:
        - Competitor research
        - Sitemap built around your units
        - Buyer journey from first look to registration
    - title: Visual Design
      text: Every screen is drawn for your development, so the site carries the same weight as the property.
      points:
        - Fully custom design
        - A look that reads as premium
        - Renders and photography treated with care
    - title: Messaging & Copywriting
      text: Professional writers tell the story of the place, the location and the life it offers.
      points:
        - Copy written for buyers
        - Location and lifestyle written plainly
        - Every page ends in a reason to register
    - title: UI/UX Design
      text: "Every page leads somewhere: the floorplans, the gallery, the registration form."
      points:
        - Easy registration and booking
        - Works on every device
        - Clear paths from every page to an enquiry
    - title: Development & QA
      text: We build on the latest tech stack, then test everything across devices and browsers before launch.
      points:
        - Fast load speeds
        - SEO-ready structure
        - Tested on devices and browsers before launch

growth:
  heading: What a website built for registrations does
  lead: Six improvements that turn your campaign spend into qualified registrations and viewings.
  items:
    - title: Conversion-focused UX
      text: Every page moves buyers towards registering or booking.
    - title: Fast load speeds
      text: Floor plans and galleries open instantly on phones.
    - title: Search and AI visibility
      text: Buyers and AI tools find your launches first.
    - title: Analytics
      text: You see which channels fill the sales gallery today.
    - title: A CMS the team runs
      text: Your team posts progress and availability without a developer.
    - title: Security and scale
      text: Launch traffic spikes never take the site down.

value:
  heading: Everything it takes to win more<br />buyer registrations, in one team
  items:
    - title: Built for English-speaking buyers
      text: Your buyers in Hong Kong, Singapore and beyond judge you in English. We write for them, so nothing reads translated.
    - title: AI-native, not AI-dependent
      text: We use AI to research buyers, launches and rival projects fast. Experts direct it and sign off every line, so nothing generic ships.
    - title: Web design that wins business
      text: Every page moves buyers from browsing floor plans to registering interest.
    - title: The whole team, none of the overhead
      text: Your project gets the whole team, from strategist to QA, with nobody to recruit, onboard or manage.
    - title: You look sharper than your competitors
      text: Design and detail that match the price per square metre, so your project outshines the launch next door.
  writerLine: Eight minutes on foot to BTS Thong Lo.

