build:
  heading: The pages a security<br />company's site needs
  image: ../../assets/industries/cybersecurity/build.jpg
  items:
    - title: Product pages
      text: Where an architect carefully decides how the product fits into the design
    - title: Service pages
      text: What an engagement includes, from the very start all the way to finish
    - title: Framework and compliance pages
      text: Mapped precisely to what your buyers answer for in their specific needs
    - title: Case study and evidence pages
      text: Proof your buyers can easily verify themselves with clear, trustworthy evidence
    - title: About and team pages
      text: The people behind the company, speaking openly and honestly on the record
    - title: Demo and enquiry flows
      text: One clear step that takes you from convinced to fully booked and ready

difference:
  heading: What changes once the site is live
  lead: What the same traffic does with a site that explains you properly.
  without:
    - CISOs read your claims with doubt
    - Certifications scattered or missing entirely
    - No research published, so expertise stays invisible
    - RFP teams struggle to find basic answers
    - Partners improvise their own material
    - Incidents start with a slow, unclear contact
  with:
    - CISOs and engineers trust what they read
    - "Trust centre: certifications and compliance mapping"
    - Threat research brings expertise and search traffic
    - Procurement and RFP teams find what they need
    - Channel partners get material they can use
    - Incident response gets a clear, fast contact route

process:
  heading: A site built to pass<br />the checks your buyers run
  steps:
    - title: Research & Strategy
      text: We study your competitors, your services and how your marketing works before anything is designed, so the site answers what your buyers actually look for.
      points:
        - Competitor research
        - Sitemap built around your services
        - Marketing funnel mapping
    - title: Visual Design
      text: Every screen is drawn for your company, with the composure a security buyer expects from a firm they'd trust with their infrastructure.
      points:
        - Fully custom design
        - Authoritative visual system
        - Premium finish on every page
    - title: Messaging & Copywriting
      text: Professional writers produce copy that explains the product precisely, so your engineers never have to rewrite it.
      points:
        - Persuasive page copy
        - Technical accuracy
        - Clear product explanation
    - title: UI/UX Design
      text: Every page is built to lead a technical visitor towards an enquiry, and works on any device they use.
      points:
        - Conversion-focused layouts
        - Enquiry paths on every page
        - Responsive on every device
    - title: Development & QA
      text: We build on the latest tech stack, then test across devices and browsers before launch so nothing breaks in front of a buyer.
      points:
        - Fast, SEO-ready build
        - Tested on every device
        - Integrated with your tools

growth:
  heading: What a website that survives<br />scrutiny does
  lead: Six improvements that let a security buyer trust the site enough to book a demo.
  items:
    - title: Conversion-focused UX
      text: Every page moves security buyers towards contact.
    - title: Fast load speeds
      text: Advisories and research open instantly, no delay.
    - title: Search and AI visibility
      text: Engineers and CISOs find your research first.
    - title: Analytics
      text: You see which research brings the most enquiries.
    - title: A CMS the team runs
      text: Advisories go live without waiting on developers' help.
    - title: Security and scale
      text: The site stays up even when attention spikes sharply.

value:
  heading: Everything it takes to win<br />security buyers, in one team
  items:
    - title: Built for English-speaking buyers
      text: CISOs and procurement judge you in English. We write for them, so nothing reads translated or vague.
    - title: AI-native, not AI-dependent
      text: We use AI to research threats, vendors and buyer questions fast. Experts direct it and sign off every line, so nothing generic ships.
    - title: Web design that wins business
      text: Every page answers what security buyers check first, then leads them to book a demo.
    - title: The whole team, none of the overhead
      text: Your company gets the whole team, from strategist to QA, with nobody to recruit, onboard or manage.
    - title: You look sharper than your competitors
      text: Design and detail that signal rigour, so you look more credible than the vendors you compete with.
  writerLine: Find the breach before your auditor does.

