title: Manufacturers & wholesalers
description: Websites for manufacturers and wholesalers across Asia. We build sites that turn buyer visits into enquiries, samples and orders.
order: 4

hero:
  eyebrow: For manufacturers and exporters
  heading: Buyers choose the supplier who looks the part
  text: Importers, brands and distributors judge what you can make from your site before they reply. We build sites that turn those visits into enquiries, samples and orders.
  image: ../../assets/industries/manufacturers-wholesalers/hero.jpg

problem:
  heading: Competitors with worse product<br />are winning your enquiries
  lead: Your product wins in person, but buyers shortlist online before anyone meets you.
  items:
    - title: Your site was built for a trade fair
      text: It went up years ago for one event, and nobody has owned it since.
    - title: Buyers cannot tell what you offer
      text: Visitors land on the homepage and leave without understanding your range or capability.
    - title: The enquiry goes to a weaker supplier
      text: A buyer compares three sites, and the best one gets the email, whatever the product.

