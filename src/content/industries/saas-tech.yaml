problem:
  heading: Your website is losing deals<br />your product would win
  lead: The product wins evaluations; the site never gets you into one.
  items:
    - title: Your developers are building the site
      text: The people shipping your product are building marketing pages instead, and both fall behind.
    - title: Visitors can't tell what you sell
      text: A technical product needs plain words fast, and the site doesn't give them.
    - title: Ads bring visitors who never book
      text: You pay for the clicks, and the site sends them away without a demo request.

