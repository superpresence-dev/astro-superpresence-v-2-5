build:
  heading: The pages a software company<br />actually needs
  image: ../../assets/industries/saas-tech/build.jpg
  items:
    - title: Homepage
      text: Clearly explain what you do in just one minute to make a strong impression.
    - title: Product and feature pages
      text: Features are designed and sold specifically to deliver meaningful outcomes for buyers.
    - title: Pricing page
      text: Compare plans easily without missing out on any valuable deals.
    - title: Demo booking flow
      text: Book your appointment quickly and effortlessly in just a few clicks.
    - title: Docs and blog integration
      text: Keep technical buyers engaged and browsing right on your website.
    - title: App connection
      text: A trial can start anywhere, anytime, with anyone involved in the process.

difference:
  heading: What changes once the site is live
  lead: What a sharper site changes, line by line.
  without:
    - Traffic visits and leaves without a demo
    - Comparison searches send buyers to competitors
    - Technical buyers leave unconvinced
    - Procurement stalls on missing compliance pages
    - The site undercuts you during a raise
    - Every page change queues behind engineering
  with:
    - Traffic turns into demos and trial sign-ups
    - Comparison searches land on your honest pages
    - Integrations, docs and changelog build technical trust
    - Procurement passes on SOC 2 and ISO pages
    - Investors see credibility, not just buyers
    - Marketing ships pages without waiting on engineering

process:
  heading: We rebuild the site so<br />it wins the vendor comparison
  steps:
    - title: Research & Strategy
      text: We study your competitors and how your buyers choose vendors before anything is designed.
      points:
        - Competitor research
        - Sitemap built around your services
        - Mapping how buyers find you
    - title: Visual Design
      text: Every screen is drawn for your company, so buyers comparing you against three other tabs see the one that belongs on the shortlist.
      points:
        - Fully custom design
        - A look that fits a funded company
        - A consistent design system
    - title: Messaging & Copywriting
      text: "We write product marketing copy: your product in the language your buyers already speak, so a cold visitor gets it before they scroll."
      points:
        - Product marketing copy
        - Your buyer's own language
        - Calls to action built around demos
    - title: UI/UX Design
      text: Every page is built to move a visitor towards a booked demo, on any device.
      points:
        - Paths for self-serve and sales-led
        - Responsive on every device
        - Demo booking flows
    - title: Development & QA
      text: We build on the latest tech stack, then test the site across devices and browsers before launch.
      points:
        - Fast load speeds
        - SEO-ready structure
        - Integrated with your tools

growth:
  heading: What growth needs the website to do
  lead: Six essential things your site must achieve before the product makes the shortlist.
  items:
    - title: Conversion-focused UX
      text: Every page moves visitors towards a demo request.
    - title: Fast load speeds
      text: Pages load fast, which keeps trial sign-ups.
    - title: Search and AI visibility
      text: Buyers and AI tools find you in comparisons.
    - title: Analytics
      text: You can see exactly which pages drive the most sign-ups.
    - title: A CMS the team runs
      text: Marketing ships pages and experiments without engineering.
    - title: Security and scale
      text: The site remains stable and responsive as traffic steadily grows.

value:
  heading: Everything it takes to win<br />more demos, in one team
  items:
    - title: Built for English-speaking buyers
      text: Your buyers evaluate software in English. We write for them, so the product never reads translated.
    - title: AI-native, not AI-dependent
      text: We use AI to research competitors, reviews and buyer questions fast. Experts direct it and sign off every line, so nothing generic ships.
    - title: Web design that wins business
      text: Every page moves visitors towards a demo or a trial, with the proof buyers need to justify it.
    - title: The whole team, none of the overhead
      text: Your product gets the whole team, from strategist to QA, with nobody to recruit, onboard or manage.
    - title: You look sharper than your competitors
      text: Design and polish that stand up against funded competitors, so buyers compare you favourably.
  writerLine: Close the month in two days, not ten.

