problem:
  heading: The strongest fund doesn't<br />always win the allocation
  lead: Founders and LPs read the site as evidence of how the firm thinks.
  items:
    - title: Your site says less than your one-pager
      text: LPs find a logo and an email address, and nothing that shows how you invest.
    - title: Founders choose firms that look right
      text: Your terms are competitive, but the sharper site gets the first call.
    - title: AI answers get your strategy wrong
      text: Ask an AI tool about your firm and it describes a fund you don't run.

