build:
  heading: Built around how capital chooses a firm
  image: ../../assets/industries/investment-firms/build.jpg
  items:
    - title: Firm overview page
      text: Your thesis, written so founders clearly recognise and connect with it immediately.
    - title: Portfolio showcase
      text: The work, shown with the right discretion to maintain professionalism and trustworthiness.
    - title: Insights and investor letters
      text: Thinking that earns the second meeting and builds a strong foundation for success.
    - title: Private LP areas
      text: Sensitive material, held securely behind the right door to protect confidentiality always.
    - title: Founder and LP enquiry flows
      text: A clear route to the right person for quick and effective communication every time.
    - title: Compliance-ready content
      text: Written with what you're allowed to say, ensuring compliance and clear communication.

difference:
  heading: What changes when<br />your site is built for growth
  lead: The difference shows up in who reaches out.
  without:
    - Thesis unclear, so anyone might approach
    - Track record stays hidden from LPs
    - LPs meet a site that undercuts the pitch
    - Founders researching investors never find you
    - Compliance buries whatever you wanted to say
    - Fund news sits years out of date
  with:
    - Your thesis helps founders and LPs self-select
    - Portfolio and track record shown within disclosure
    - LPs get a credible first impression pre-fundraising
    - Founders researching investors find you and reach out
    - Compliance handled without burying the message
    - Fund news and team changes stay current

process:
  heading: How we build a site that<br />wins the allocation
  steps:
    - title: Research & Strategy
      text: We study your peers, your mandate and how LPs and founders find you before anything is designed, so nothing on the site is built on assumptions.
      points:
        - Peer and competitor review
        - Sitemap built around your strategies
        - Audience mapping for LPs and founders
    - title: Visual Design
      text: Every screen is drawn for your firm, so the site carries the weight your reputation already has when an LP opens it.
      points:
        - Fully custom design
        - Premium visual standard
        - Design for authority and trust
    - title: Messaging & Copywriting
      text: Professional writers make your thesis clear in plain English, written with compliance review in mind.
      points:
        - Thesis and strategy messaging
        - Portfolio and team copy
        - Copy written in English
    - title: UI/UX Design
      text: Every page moves the right visitor towards a conversation, and keeps the wrong ones out of your inbox.
      points:
        - Investor and founder journeys
        - Private sections where needed
        - Responsive on every device
    - title: Development & QA
      text: We build on the latest tech stack, fast and structured for search engines, and test everything before launch.
      points:
        - Latest tech stack build
        - Fast load speeds
        - SEO-ready structure

growth:
  heading: What a website built to win<br />deals does
  lead: Six improvements that help founders, LPs and co-investors read the firm clearly, and reach out.
  items:
    - title: Conversion-focused UX
      text: Every page moves the right people to reach out.
    - title: Fast load speeds
      text: Portfolio and insights open instantly for LPs anytime.
    - title: Search and AI visibility
      text: Founders researching investors find you first every time.
    - title: Analytics
      text: You see which content brings founder approaches.
    - title: A CMS the team runs
      text: Your team posts news without a developer.
    - title: Security and scale
      text: The site stays dependable through every stage of fundraise.

value:
  heading: Everything it takes to win<br />founders and LPs, in one team
  items:
    - title: Built for English-speaking buyers
      text: LPs and founders judge you in English. We write for them, so your thesis never reads translated.
    - title: AI-native, not AI-dependent
      text: We use AI to research your sectors, portfolio and peers fast. Experts direct it and sign off every line, so nothing generic ships.
    - title: Web design that wins business
      text: Every page makes your thesis and track record easy to judge, then leads founders to pitch.
    - title: The whole team, none of the overhead
      text: Your fund gets the whole team, from strategist to QA, with nobody to recruit, onboard or manage.
    - title: You look sharper than your competitors
      text: Design and detail that look institutional, so founders and LPs rate you above peer funds.
  writerLine: Series A capital for Southeast Asian fintech.

